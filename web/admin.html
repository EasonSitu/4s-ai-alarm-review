<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>4S · 告警审核台</title><link rel="stylesheet" href="/assets/style.css"><script defer src="/assets/admin.js"></script></head>
<body>
<header class="top"><div class="wrap topin"><a class="brand" href="/admin"><b>4S</b><span>现场安全</span></a><nav><a class="current" href="/admin">告警审核</a><a href="/docs">接口文档 ↗</a></nav><span id="health" class="health">正在连接</span></div></header>
<main class="wrap">
<div class="intro"><div><p class="eyebrow">安全帽 / 反光衣</p><h1>告警审核台</h1></div><div class="introactions"><button id="modelSettingsBtn">模型设置</button><button class="primary" id="uploadBtn">＋ 提交图片</button></div></div>
<div class="switch"><span id="config"></span></div>
<section class="metrics" aria-label="当前环境的任务统计">
<div><span>收到的报警</span><strong id="all">—</strong></div><div><span>等待与处理中</span><strong id="pending">—</strong></div><div><span>已完成审核</span><strong id="done">—</strong></div><div><span>审核失败</span><strong id="failed">—</strong></div></section>
<section class="panel"><div class="paneltitle"><h2>任务列表</h2><button id="refresh" class="link">↻ 刷新</button></div>
<form id="filters"><label>项目编号<input name="project" placeholder="输入编号"></label><label>报警编号<input name="alert" placeholder="输入编号"></label><label>处理状态<select name="status"></select></label><label>审核结论<select name="verdict"></select></label><label>回调状态<select name="callback"></select></label>
<div class="dates"><label>收件日期（UTC）<input name="since" type="date" aria-label="起始日期"></label><span>至</span><input name="until" type="date" aria-label="结束日期"></div><div class="filterActions"><button type="reset" class="link">清空</button><button>查询</button></div></form>
<p id="notice" role="status" hidden></p>
<div class="tablewrap"><table><thead><tr><th>报警编号 / 项目 / 图片</th><th>报警类型</th><th>收件时间</th><th>处理状态</th><th>审核结论</th><th>回调状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div>
<div id="empty" class="empty" hidden><strong>暂无任务</strong><p></p></div>
<footer><span id="total">—</span><div><button id="prev" aria-label="上一页">‹</button><span id="page">1 / 1</span><button id="next" aria-label="下一页">›</button></div></footer></section>
</main>
<dialog id="detail"><div class="dialoghead"><div><p class="eyebrow" id="detailMode"></p><h2>任务详情</h2></div><button class="close" data-close aria-label="关闭详情">×</button></div>
<div class="detailgrid"><div class="photo"><label id="frameLabel" hidden>报警图片<select id="frameSelect"></select></label><p id="frameResult"></p><button id="zoomBtn" title="放大原图"><img id="preview" alt="平台提交的原始告警图片"><span>放大原图 ↗</span></button><p id="scope"></p></div><div><h3>审核结论</h3><span id="verdict"></span><p id="reason"></p><dl id="facts"></dl><p id="deliveryError"></p><button id="resend" hidden>重新发送回调</button></div></div></dialog>
<dialog id="zoom"><div class="dialoghead"><h2>原始图片</h2><button data-close aria-label="关闭原图">×</button></div><div class="large"><img alt="放大的原始告警图片" id="fullImage"></div></dialog>
<dialog id="upload"><form id="uploadForm"><div class="dialoghead"><h2 id="uploadTitle">提交图片</h2><button type="button" data-close aria-label="关闭提交">×</button></div><p id="uploadHint"></p><label>项目编号<input name="project_id" required maxlength="100"></label><label>报警编号<input name="alert_id" required maxlength="100"></label><label>报警类型<select name="alarm_type"><option value="no_helmet">未戴安全帽</option><option value="no_vest">未穿反光衣</option><option value="danger_zone">危险区域</option><option value="combined">组合报警</option></select></label><label>报警图片（1–5 张，每张最多 8 MiB）<input name="image" type="file" multiple accept="image/jpeg,image/png" required></label><p id="uploadError" role="alert"></p><button class="primary" id="send">提交并查看</button></form></dialog>
<dialog id="modelSettings">
  <form id="modelForm">
    <div class="dialoghead"><h2>模型设置</h2><button type="button" data-close aria-label="关闭模型设置">×</button></div>
    <p id="activeModel"></p>
    <h3 class="modelsection">1. 配置平台和模型</h3>
    <label>选择配置<select id="modelProfiles"></select></label>
    <label>配置名称<input name="name" required maxlength="48" pattern="[A-Za-z0-9_-]+" placeholder="例如 deepseek 或 bailian"></label>
    <label>模型平台<select name="provider"><option value="deepseek">DeepSeek</option><option value="bailian">阿里云百炼</option><option value="compatible">其他兼容平台</option></select></label>
    <label>API 基础地址<input name="model_base" type="url" required maxlength="2048" placeholder="例如 https://api.deepseek.com"></label>
    <label>API Key<input name="model_key" type="password" maxlength="4096" autocomplete="new-password" placeholder="请输入供应商提供的 API Key"></label>
    <small id="modelKeyHelp">请填写与该地址对应的 API Key。</small>
    <div><button type="button" id="fetchCatalog">读取平台模型列表</button></div>
    <label>选择图片模型<select id="catalogModels"><option value="">先读取模型列表，也可以手动填写</option></select></label>
    <label>视觉模型 ID<input name="model" required maxlength="160" placeholder="选择模型，或手动填写 ID"></label>
    <small class="modelhint">列表由平台返回；实际是否可调用，会在启用前通过图片验证。</small>
    <div><button type="submit" id="saveModel">保存模型配置</button></div>
    <h3 class="modelsection">2. 设置审核顺序</h3>
    <label>主模型<select id="primaryProfile"></select></label>
    <label>备用模型<select id="fallbackProfile"></select></label>
    <label>主模型超时切换（秒）<input id="primaryTimeout" type="number" min="1" max="120" step="1" value="15"></label>
    <small class="modelhint">主模型超时或发生技术故障时，改用备用模型；下一张图片仍先使用主模型。备用模型也会收到图片，可能产生额外费用。</small>
    <p id="modelMessage" role="status" aria-live="polite"></p>
    <div class="modelactions"><button type="button" id="activateModel" class="primary">验证并启用主备</button><button type="button" id="pauseModel">暂停审核</button></div>
  </form>
</dialog>
</body></html>
